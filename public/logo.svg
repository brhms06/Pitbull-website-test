<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="Crown Legacy Dobermans logo">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#404349"/>
      <stop offset="1" stop-color="#0f1011"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 4)">
    <rect width="64" height="64" rx="16" fill="url(#badge)"/>
    <!-- Doberman head: lean wedge, pointed cropped ears -->
    <g fill="#e9e2d6">
      <polygon points="14,30 24,4 29,28"/>
      <polygon points="50,30 40,4 35,28"/>
      <path d="M32 19c-8 0-13 6-13 14 0 9 6 16 13 16s13-7 13-16c0-8-5-14-13-14z"/>
    </g>
    <!-- eyes -->
    <g fill="#0d0e0f">
      <ellipse cx="27" cy="37" rx="2.3" ry="3"/>
      <ellipse cx="37" cy="37" rx="2.3" ry="3"/>
    </g>
    <!-- nose + mouth -->
    <path d="M32 42l-2.3 2.1h4.6z" fill="#8a3a15"/>
    <path d="M32 45c-1.8 1.8-3.8 1.4-4.6 0M32 45c1.8 1.8 3.8 1.4 4.6 0" fill="none" stroke="#0d0e0f" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g font-family="Oswald, sans-serif">
    <text x="82" y="34" font-size="18" font-weight="700" fill="#0f1011">CROWN LEGACY</text>
    <text x="82" y="56" font-size="16" font-weight="600" fill="#8a3a15" letter-spacing="3">DOBERMANS</text>
  </g>
</svg>
