<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ironline Bullies">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7c99"/>
      <stop offset="1" stop-color="#213e53"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- American Bully head: broad, rounded, with folded ears -->
  <g fill="#f4efe6">
    <ellipse cx="17" cy="24" rx="6" ry="8" transform="rotate(-20 17 24)"/>
    <ellipse cx="47" cy="24" rx="6" ry="8" transform="rotate(20 47 24)"/>
    <path d="M32 20c-9 0-14 7-14 15 0 8 6 14 14 14s14-6 14-14c0-8-5-15-14-15z"/>
  </g>
  <!-- eyes -->
  <g fill="#213e53">
    <ellipse cx="26" cy="34" rx="2.6" ry="3.2"/>
    <ellipse cx="38" cy="34" rx="2.6" ry="3.2"/>
  </g>
  <!-- nose + mouth -->
  <path d="M32 39l-2.6 2.4h5.2z" fill="#b5502e"/>
  <path d="M32 42c-2 2-4.2 1.6-5.2 0M32 42c2 2 4.2 1.6 5.2 0" fill="none" stroke="#213e53" stroke-width="1.4" stroke-linecap="round"/>
</svg>
